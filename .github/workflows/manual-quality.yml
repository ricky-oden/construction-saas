name: Manual quality verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-v1-manual-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.13

      - name: Prepare learning-only environment
        run: cp .env.example .env

      - name: Run the reproducible Phase 9 verification
        run: scripts/verify-phase9.sh
